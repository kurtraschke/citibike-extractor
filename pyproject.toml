[project]
name = "citibike-extractor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
license = "BlueOak-1.0.0"
license-files = ["LICENSE.md"]
requires-python = ">=3.14"
dependencies = [
    "duckdb>=1.5.5",
    "fsspec>=2026.6.0",
    "tqdm>=4.70.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.2",
    "ty>=0.0.65",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[project.scripts]
citibike-extractor = "citibike_extractor:main"
